# Publishes site/ to GitHub Pages.
#
# Inert until Pages is enabled for this repository:
# Settings → Pages → Build and deployment → Source: GitHub Actions.
#
# Verifies that the committed site/ matches what build.py produces, so the
# published site can never drift from content/ and src/.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild and check site/ is in sync
        run: |
          python3 build.py
          if ! git diff --quiet -- site preview.html; then
            echo "::error::site/ is out of date. Run 'python3 build.py' and commit the result."
            git --no-pager diff --stat -- site preview.html
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
